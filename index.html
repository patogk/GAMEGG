<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MEGA HEAD CUP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: #E8F1FF;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-canvas {
      display: block;
      background: #000;
      image-rendering: crisp-edges;
      box-shadow: 0 0 80px rgba(0, 229, 255, 0.15), 0 0 80px rgba(255, 26, 161, 0.15);
    }
    #boot-msg {
      position: fixed;
      bottom: 8px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: #5A6F88;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="1280" height="720"></canvas>
  <div id="boot-msg">MEGA HEAD CUP · Tier 0 prototype · v0.1</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
